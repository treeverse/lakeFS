name: 'Post PR to #rfr'

# Asks the workflow of the same name in treeverse/dev to post this PR to the #rfr Slack
# channel or update its message.  A failed post shows only in that workflow's runs.

on:
  pull_request:
    types: [opened, ready_for_review, review_requested, review_request_removed]

permissions: {}

jobs:
  trigger:
    # PRs from forks are left out on purpose: they get no secrets, and this job holds
    # a key.  Drafts and bot PRs are never posted.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The token is scoped to treeverse/dev, with the Actions permission only.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.TREEVERSE_CI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.TREEVERSE_CI_BOT_PRIVATE_KEY }}
          owner: treeverse
          repositories: dev
          permission-actions: write

      - name: Start the workflow in treeverse/dev
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.event.repository.name }}
          NUMBER: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
          # Empty when a team is requested.
          REVIEWER: ${{ github.event.requested_reviewer.login }}
        run: |
          gh workflow run rfr-post.yaml --repo treeverse/dev --ref main \
            -f repository="$REPOSITORY" -f number="$NUMBER" \
            -f action="$ACTION" -f reviewer="$REVIEWER"
